<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>涉密考试管理系统 · 智慧办公平台</title>
<style>
/* ========== 环境 Token（light/dark）========== */
:root{
  --bg:#F2F3F5; --side:#ffffff; --card:#ffffff; --card-2:#fafbfc; --card-3:#f5f6f8;
  --border:rgba(0,0,0,.08); --border-2:rgba(0,0,0,.05);
  --text:#1C1C1E; --text-2:#3C3C43; --text-3:#8E8E93; --text-4:#C7C7CC;
  --shadow:0 2px 12px rgba(0,0,0,.05); --shadow-lg:0 8px 28px rgba(0,0,0,.13);
  --header-text:#ffffff; --header-text-2:rgba(255,255,255,.72);
  --watermark:rgba(0,0,0,.04);
  --scroll-thumb:rgba(0,0,0,.18);
  --hover:rgba(0,0,0,.04);
  /* 品牌功能色（规范 §3.1） */
  --success:#30D158; --danger:#FF453A; --warn:#FF9F0A; --gold:#FFD60A;
  --sky:#5AC8FA; --purple:#BF5AF2; --gray:#8E8E93;
  --dot-off:rgba(0,0,0,.12);
  /* 圆角（规范 §5.2） */
  --r-card:12px; --r-panel:16px; --r-pill:14px;
}
/* ========== 平台主题（6 色 Arco）========== */
[data-cp="red"]    { --cp:#F53F3F; --cp-rgb:245,63,63;  --cp-bg:#FFECE8; --cp-top:linear-gradient(135deg,#C92B2B,#F53F3F); }
[data-cp="blue"]   { --cp:#165DFF; --cp-rgb:22,93,255;  --cp-bg:#EEF3FF; --cp-top:linear-gradient(135deg,#0E3FBF,#165DFF); }
[data-cp="purple"] { --cp:#722ED1; --cp-rgb:114,46,209; --cp-bg:#F5F0FF; --cp-top:linear-gradient(135deg,#4F1D9E,#722ED1); }
[data-cp="cyan"]   { --cp:#0FC6C2; --cp-rgb:15,198,194; --cp-bg:#E8FAFA; --cp-top:linear-gradient(135deg,#0A8A87,#0FC6C2); }
[data-cp="green"]  { --cp:#00B42A; --cp-rgb:0,180,42;   --cp-bg:#E8FFED; --cp-top:linear-gradient(135deg,#007D1F,#00B42A); }
[data-cp="orange"] { --cp:#FF7D00; --cp-rgb:255,125,0;  --cp-bg:#FFF3E8; --cp-top:linear-gradient(135deg,#BF5C00,#FF7D00); }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Microsoft YaHei UI","Source Han Sans SC","Noto Sans CJK SC","Noto Sans SC","Heiti SC","WenQuanYi Micro Hei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
svg{display:block;flex-shrink:0}
/* 图标尺寸统一：默认 16，按上下文覆盖 */
.side-i svg{width:18px;height:18px}
.stat .ic svg{width:22px;height:22px}
.hd-icon svg{width:18px;height:18px}
.login-logo svg{width:28px;height:28px}
.hd-logo{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none}
.hd-logo svg{width:28px;height:28px;color:#fff}
.cp-trigger .dot{width:18px;height:18px}
.btn-p svg,.btn-2 svg,.btn-g svg{width:14px;height:14px}
.login-tip svg{width:14px;height:14px}
.m-head .x svg{width:16px;height:16px}
.opt .box svg{width:12px;height:12px}
.cp-cell.on::after{width:14px;height:14px}

/* ========== 水印 ========== */
.watermark{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.7;display:none;overflow:hidden}
[data-wm="on"] .watermark{display:block}
.watermark span{position:absolute;font-size:18px;color:var(--watermark);transform:rotate(-24deg);white-space:nowrap;letter-spacing:6px}

/* ========== 登录 ========== */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--cp-bg) 0%,var(--bg) 50%,var(--cp-bg) 100%);position:relative}
.login-card{width:400px;background:var(--card);border-radius:20px;padding:36px 34px 30px;
  box-shadow:var(--shadow-lg);border:1px solid var(--border);position:relative;z-index:2}
.login-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.login-logo{width:52px;height:52px;border-radius:14px;background:var(--cp-top);
  display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 6px 20px rgba(var(--cp-rgb),.35)}
.login-head h1{font-size:18px;color:var(--text);line-height:1.3}
.login-head p{font-size:12px;color:var(--text-3)}
.lv-pill{display:inline-flex;align-items:center;gap:5px;margin:14px 0 18px;
  background:var(--cp-bg);color:var(--cp);border:1px solid rgba(var(--cp-rgb),.2);
  padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:500}
.field input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;
  background:var(--card-2);transition:.15s;color:var(--text)}
.field input:focus{outline:none;border-color:var(--cp);box-shadow:0 0 0 3px rgba(var(--cp-rgb),.12);background:var(--card)}
.login-tip{background:var(--cp-bg);border:1px solid rgba(var(--cp-rgb),.15);color:var(--cp);
  font-size:12px;border-radius:12px;padding:11px 13px;margin:4px 0 14px;display:flex;gap:9px;align-items:flex-start;line-height:1.6}
.login-tip svg{flex:none;margin-top:2px}
.agree{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:var(--text-2);margin:6px 0 16px;cursor:pointer;line-height:1.7}
.agree input{margin-top:4px;accent-color:var(--cp);width:15px;height:15px}
.btn{width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:600;
  background:var(--cp);color:#fff;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex-shrink:0}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{background:var(--card-3);color:var(--text-3);cursor:not-allowed}
.login-foot{text-align:center;font-size:11px;color:var(--text-3);margin-top:18px;line-height:1.8}

/* ========== 主框架（IoTPlatform 布局）========== */
#app{display:none;height:100vh;grid-template-columns:220px 1fr;grid-template-rows:70px 1fr;
  grid-template-areas:"header header" "side main";background:var(--bg)}
.hd{grid-area:header;background:var(--cp-top);color:var(--header-text);
  display:flex;align-items:center;padding:0 20px;box-shadow:0 1px 0 rgba(0,0,0,.06);position:relative;z-index:5}
.hd-title{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600;letter-spacing:.3px}
.hd-title .crumb{font-size:11px;opacity:.7;font-weight:400;padding-left:10px;border-left:1px solid rgba(255,255,255,.25);margin-left:4px}
.hd-title .secret{background:rgba(255,255,255,.18);padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;backdrop-filter:blur(8px)}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hd-btn{padding:7px 12px;border-radius:9px;font-size:13px;color:var(--header-text);
  display:flex;align-items:center;gap:6px;transition:.15s;background:rgba(255,255,255,.10)}
.hd-btn:hover{background:rgba(255,255,255,.20)}
.hd-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.10);
  display:flex;align-items:center;justify-content:center;transition:.15s;color:var(--header-text);cursor:pointer}
.hd-icon:hover{background:rgba(255,255,255,.20)}
.hd-icon{position:relative}
.cp-popup{position:absolute;top:44px;right:0;min-width:230px;padding:12px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:60;display:none;color:var(--text)}
.cp-popup.show{display:block}
.cp-popup .ttl{font-size:12px;color:var(--text-3);margin-bottom:10px;font-weight:500}
.cp-popup .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.cp-popup .cell{width:26px;height:26px;border-radius:50%;cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:.15s;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.cp-popup .cell:hover{transform:scale(1.08)}
.cp-popup .cell.on{outline:2px solid currentColor;outline-offset:2px}
.cp-popup .cell.on::after{content:"✓";font-size:14px;font-weight:700;color:#fff}
.cp-popup .label{margin-top:10px;font-size:11.5px;color:var(--text-3);text-align:center}
.hd-user{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;border-radius:20px;background:rgba(255,255,255,.10)}
.hd-user .av{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--cp);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.hd-user .nm{font-size:13px;font-weight:500}

/* 主题选择器 */
.cp-trigger{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.10);
  position:relative;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}
.cp-trigger:hover{background:rgba(255,255,255,.20)}
.cp-trigger .dot{width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 4px var(--cp)}
.cp-pop{position:absolute;top:48px;right:0;width:240px;background:var(--card);border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--shadow-lg);padding:16px;display:none;z-index:20}
.cp-pop.show{display:block;animation:fade .18s}
.cp-pop h5{font-size:12px;color:var(--text-3);font-weight:600;margin-bottom:10px;letter-spacing:.3px}
.cp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cp-cell{aspect-ratio:1;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.13s;position:relative}
.cp-cell:hover{transform:scale(1.06)}
.cp-cell.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px currentColor}
.cp-cell.on::after{content:"";position:absolute;width:14px;height:14px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>") center/contain no-repeat}

/* 平台切换 */
.pl-pop{position:absolute;top:48px;right:0;width:200px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;display:none;z-index:20}
.pl-pop.show{display:block;animation:fade .18s}
.pl-item{padding:10px 12px;border-radius:9px;display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer;transition:.13s;color:var(--text)}
.pl-item:hover{background:var(--hover)}
.pl-item svg{color:var(--cp)}
.pl-item small{font-size:11px;color:var(--text-3);display:block;margin-top:1px}

/* 侧边栏 */
.side{grid-area:side;background:var(--side);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden}
.side-scroll{flex:1;overflow-y:auto;padding:10px 8px}
.side-g{font-size:11px;color:var(--text-3);padding:14px 12px 6px;letter-spacing:.6px;font-weight:600}
.side-i{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;
  color:var(--text-2);font-size:13.5px;margin-bottom:2px;cursor:pointer;transition:.13s;position:relative}
.side-i svg{width:18px;height:18px;flex:none;opacity:.7}
.side-i:hover{background:var(--hover);color:var(--text)}
.side-i.on{background:var(--cp-bg);color:var(--cp);font-weight:600}
.side-i.on svg{opacity:1;color:var(--cp)}
.side-i.on::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;background:var(--cp);border-radius:0 3px 3px 0}
.side-foot{padding:14px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3);line-height:1.8}
.side-foot .lv{display:inline-block;background:var(--cp-bg);color:var(--cp);padding:2px 8px;border-radius:5px;font-weight:600;margin-top:4px}

/* 主内容区 */
.main{grid-area:main;overflow-y:auto;padding:22px;position:relative;z-index:2}
.view{display:none;animation:fade .22s}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 通用组件 */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);
  box-shadow:var(--shadow);padding:18px}
.page-head{display:flex;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.page-head > :not(.spacer){flex-shrink:0}
.page-head h2{font-size:20px;font-weight:600}
.page-head .sub{color:var(--text-3);font-size:12.5px}
.spacer{flex:1}
.btn-p{background:var(--cp);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:500;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;box-shadow:0 2px 8px rgba(var(--cp-rgb),.25);border:none;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn-p:hover{filter:brightness(1.06)}
.btn-2{background:var(--card-2);border:1px solid var(--border);color:var(--text);
  padding:9px 15px;border-radius:10px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.13s;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn-2:hover{background:var(--hover)}
.btn-g{background:#00B42A;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn-g:hover{filter:brightness(1.06)}

/* 统计卡（参考截图：多色语义卡 = 图标 + 名称 + 徽标 + 大数 + 3 子项 + 迷你渐变图） */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);
  padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .3s cubic-bezier(.25,.46,.45,.94),box-shadow .3s;
  animation:cardIn .4s cubic-bezier(.25,.46,.45,.94) backwards}
.stat:hover{transform:scale(1.02);box-shadow:var(--shadow-lg)}
.stat:nth-child(2){animation-delay:.05s}
.stat:nth-child(3){animation-delay:.1s}
.stat:nth-child(4){animation-delay:.15s}
@keyframes cardIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.stat-head{display:flex;align-items:center;gap:10px}
.stat-icon{width:36px;height:36px;border-radius:10px;background:var(--sc);color:#fff;
  display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.stat-icon svg{width:18px;height:18px}
.stat-title{font-size:14px;font-weight:600;color:var(--text)}
.stat-badge{margin-left:auto;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:500;
  background:var(--sc-bg);color:var(--sc)}
.stat-num{font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.stat-num .unit{font-size:14px;font-weight:500;color:var(--text-3);margin-left:4px}
.stat-subs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-sub{background:var(--card-2);border-radius:8px;padding:8px 10px;text-align:center}
.stat-sub b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.stat-sub span{font-size:11px;color:var(--text-3);margin-top:1px;display:block}
.stat-spark{height:40px;line-height:0;margin-top:2px}
.stat-spark svg{width:100%;height:40px}

/* 表格 */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{padding:9px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--card-2);min-width:130px;color:var(--text)}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--cp);background:var(--card)}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border-2);white-space:nowrap}
th{background:var(--card-2);color:var(--text-2);font-weight:600;font-size:12px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--hover)}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:14px;font-size:11.5px;font-weight:500;white-space:nowrap;gap:4px}
.t-red{background:var(--cp-bg);color:var(--cp)}
.t-blue{background:#EEF3FF;color:#165DFF}
.t-cyan{background:#E8FAFA;color:#0FC6C2}
.t-green{background:#E8FFED;color:#00B42A}
.t-amber{background:#FFF3E8;color:#FF7D00}
.t-purple{background:#F5F0FF;color:#722ED1}
.t-gray{background:var(--card-3);color:var(--text-3)}
.t-danger{background:#FFECE8;color:#EF4444}
.row-act{display:flex;gap:14px;font-size:12.5px;align-items:center}
.act-v{color:#165DFF;cursor:pointer;font-weight:500}
.act-v:hover{text-decoration:underline}
.act-d{color:#EF4444;cursor:pointer;font-weight:500}
.act-d:hover{text-decoration:underline}
.act-c{color:#165DFF;cursor:pointer;font-weight:500}
.act-c:hover{text-decoration:underline}
.act-n{color:var(--text-3);cursor:pointer}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(15,17,23,.5);z-index:50;display:none;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.mask.show{display:flex;animation:fade .2s}
.modal{background:var(--card);border-radius:18px;width:680px;max-width:100%;max-height:90vh;
  display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:hidden;border:1px solid var(--border)}
.modal.lg{width:880px}.modal.sm{width:440px}
.m-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.m-head h3{font-size:16px;font-weight:600}
.m-head .x{margin-left:auto;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;color:var(--text-2);transition:.13s;background:none;border:none;cursor:pointer}
.m-head .x:hover{background:var(--hover)}
.m-body{padding:18px 20px;overflow-y:auto}
.m-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.f-row{display:flex;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.f-row .field{flex:1;margin-bottom:0;min-width:200px}
.f-row .field.full{flex-basis:100%}
.opt-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.opt-row input[type=text]{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card-2);color:var(--text)}
.opt-row .rk{width:26px;height:26px;border-radius:7px;background:var(--card-3);display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-2);flex:none}
.tabs{display:flex;gap:4px;background:var(--card-2);padding:4px;border-radius:11px;margin-bottom:16px;border:1px solid var(--border-2)}
.tabs button{flex:1;padding:8px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-2);transition:.13s;border:none;background:none;cursor:pointer}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--cp);color:#fff;box-shadow:0 2px 8px rgba(var(--cp-rgb),.25);font-weight:600}
.add-opt{font-size:12px;color:var(--cp);font-weight:600;margin-top:4px;cursor:pointer;display:inline-flex;align-items:center;gap:3px}

/* 考试 */
.exam-wrap{display:flex;gap:16px}
.exam-main{flex:1;min-width:0;display:flex;flex-direction:column}
.exam-bar{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 20px;
  display:flex;align-items:center;gap:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.exam-bar .ti{font-size:16px;font-weight:600}
.exam-bar .tm{margin-left:auto;font-size:18px;font-weight:600;color:var(--cp);font-variant-numeric:tabular-nums}
.exam-bar .pg{font-size:13px;color:var(--text-2)}
.exam-q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;
  box-shadow:var(--shadow);flex:1;margin-bottom:14px}
.exam-q .qt{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;gap:10px;align-items:center}
.exam-q .qt .no{color:var(--cp)}
.exam-q .qmeta{font-size:12px;color:var(--text-3);margin-bottom:16px;display:flex;gap:8px;align-items:center}
.opt{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);
  border-radius:11px;margin-bottom:10px;cursor:pointer;transition:.13s;background:var(--card-2)}
.opt:hover{border-color:var(--cp)}
.opt.sel{border-color:var(--cp);background:var(--cp-bg)}
.opt .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--text-4);flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px}
.opt.sel .box{background:var(--cp);border-color:var(--cp)}
.opt.multi .box{border-radius:50%}
.q-nav{display:flex;gap:10px}
.sheet{width:260px;flex:none;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.sheet h4{font-size:13px;font-weight:600;margin-bottom:4px}
.sheet .sc{font-size:11.5px;color:var(--text-3);margin-bottom:12px}
.sheet-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;
  background:var(--card-2);border:1px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;transition:.13s;color:var(--text-2)}
.sq.ans{background:var(--cp);color:#fff;border-color:var(--cp)}
.sq.cur{border-color:var(--cp);box-shadow:0 0 0 2px var(--cp-bg)}
.sq.flag{background:#FF7D00;color:#fff;border-color:transparent}
.sheet-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;font-size:11px;color:var(--text-2)}
.sheet-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.sheet-foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:8px}

.switch-warn{position:fixed;left:50%;top:74px;transform:translateX(-50%);background:#2a1a1c;color:#ffd9db;
  padding:12px 20px;border-radius:11px;font-size:13px;z-index:60;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);
  border:1px solid #5a2a2e;align-items:center;gap:9px}
.switch-warn.show{display:flex;animation:fade .2s}

/* 合格证 */
.cert{width:580px;max-width:100%;margin:0 auto;border:3px double var(--cp);border-radius:14px;
  padding:30px 34px;background:linear-gradient(160deg,var(--card),var(--cp-bg));text-align:center;position:relative}
.cert .seal{position:absolute;right:34px;top:30px;width:84px;height:84px;border:2px solid var(--cp);
  border-radius:50%;color:var(--cp);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;transform:rotate(-14deg);text-align:center;line-height:1.3;opacity:.85}
.cert h3{color:var(--cp);font-size:22px;letter-spacing:3px;font-weight:600}
.cert .tt{font-size:14px;margin:14px 0 6px;font-weight:500;color:var(--text-2);letter-spacing:1px}
.cert .info{text-align:left;display:inline-block;margin:10px auto;font-size:14px;line-height:2.1}
.cert .no{margin-top:18px;font-size:13px;color:var(--text-2)}

/* 图表 */
.charts{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);
  padding:14px 18px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;flex-wrap:wrap}
.chart-head h4{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.chart-head h4 svg{width:15px;height:15px;color:var(--cp);flex:none}
.chart-head .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chart-head .unit{font-size:11px;color:var(--text-3);background:var(--card-2);padding:2px 8px;border-radius:8px;border:1px solid var(--border-2)}
.chart-legend{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-2)}
.chart-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chart-legend i.outline{background:#fff;border:1.5px solid var(--cp);box-sizing:border-box}
.chart-canvas{display:flex;align-items:center;justify-content:center;margin-top:2px;flex:1}
.chart-canvas>svg{width:100%;height:auto;max-width:100%;max-height:240px}
.chart-canvas.sm>svg{max-width:220px;max-height:220px}
.pie-row{display:flex;align-items:center;justify-content:center;gap:56px;flex-wrap:wrap;margin-top:4px}
.legend{display:flex;flex-direction:column;flex-wrap:wrap;gap:10px 18px;font-size:13px;color:var(--text-2)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.legend.row{display:flex;flex-direction:row}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.take-tip{display:flex;gap:8px;align-items:flex-start;background:var(--card-2);border:1px solid var(--border-2);
  border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--text-2);margin-bottom:16px}
.take-tip svg{width:16px;height:16px;color:var(--cp);flex:none;margin-top:1px}
.take-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.take-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:18px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.take-card .tc-top{display:flex;align-items:center;gap:12px}
.take-card .tc-top>svg{width:26px;height:26px;color:var(--cp);flex:none}
.take-card .tc-top>div{flex:1;min-width:0}
.take-card .tc-name{font-size:15px;font-weight:600}
.take-card .tc-range{font-size:12.5px;color:var(--text-3);margin-top:2px}
.take-card .tc-meta{display:flex;gap:20px;flex-wrap:wrap;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);padding:12px 0}
.take-card .tc-meta>div{display:flex;flex-direction:column;gap:3px}
.take-card .tc-meta span{font-size:11px;color:var(--text-3)}
.take-card .tc-meta b{font-size:13.5px;font-weight:600}
.take-card .tc-act{display:flex;justify-content:flex-end;margin-top:2px}
.notice{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:14px 18px;box-shadow:var(--shadow)}
.notice .dot{width:8px;height:8px;border-radius:50%;background:var(--cp);flex:none}
.notice .dot.g{background:var(--success);box-shadow:0 0 8px var(--success)}
.notice .dot.w{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.notice .dot.d{background:var(--danger);box-shadow:0 0 8px var(--danger)}
/* 能力范围 Pill（规范 §8.7：2 列网格） */
.pill-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pill{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:var(--r-pill);
  font-size:12px;background:var(--card-2);border:1px solid var(--border);color:var(--text-3)}
.pill svg{width:14px;height:14px;flex:none}
.pill b{margin-left:auto;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
/* 迷你进度条（数据展示） */
.pbar{height:6px;border-radius:3px;background:var(--card-3);overflow:hidden;min-width:56px}
.pbar i{display:block;height:100%;border-radius:3px}
/* 状态指示点（规范 §8.6） */
.sdot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none;background:currentColor}
.sdot.g{background:var(--success);box-shadow:0 0 6px var(--success)}
.sdot.w{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.sdot.d{background:var(--danger);box-shadow:0 0 6px var(--danger)}
.sdot.off{background:var(--dot-off);box-shadow:none}
td .num,.num{font-variant-numeric:tabular-nums}
.notice h4{margin-bottom:10px;font-size:14px;font-weight:600}
.notice .ni{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--border);font-size:13px;align-items:center}
.notice .ni:last-child{border-bottom:none}
.notice .ni .dt{margin-left:auto;color:var(--text-3);font-size:11.5px;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--text-3);font-size:13px}
.toggle{position:relative;width:44px;height:24px;background:var(--card-3);border-radius:20px;transition:.2s;flex:none;cursor:pointer;border:1px solid var(--border)}
.toggle.on{background:var(--cp)}
.toggle::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;
  top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on::after{left:22px}
.set-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border-2)}
.set-row:last-child{border-bottom:none}
.set-row .st{flex:1}
.set-row .st b{font-size:14px;font-weight:600}
.set-row .st p{font-size:12px;color:var(--text-3);margin-top:2px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--card);
  color:var(--text);padding:11px 20px;border-radius:11px;z-index:80;
  box-shadow:var(--shadow-lg);font-size:13px;border:1px solid var(--border);
  display:flex;align-items:center;gap:9px;animation:slideUp .25s}
.toast svg{color:var(--cp)}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media(max-width:1100px){.stat-row{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}}

/* 近6次考试通过率（与下方折线图共用） */
const PASS_RATE=[72,85,68,90,88,94];
function sparkline(data,color,type){
  const W=200,H=40,max=Math.max.apply(null,data),min=Math.min.apply(null,data),range=(max-min)||1;
  if(type==='bar'){
    const slot=W/data.length,bw=Math.max(4,slot-6);
    let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
    data.forEach((d,i)=>{const h=Math.max(5,(d-min)/range*(H-10)+5);
      s+=`<rect x="${(i*slot+3).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="3" style="fill:${color};opacity:.85"/>`;});
    return s+`</svg>`;
  }
  /* 平滑曲线（圆润，无尖角） */
  const step=W/(data.length-1);
  const pts=data.map((d,i)=>({x:i*step,y:H-5-(d-min)/range*(H-14)}));
  let path=`M${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const cp1x=p1.x+(p2.x-p0.x)/6,cp1y=p1.y+(p2.y-p0.y)/6;
    const cp2x=p2.x-(p3.x-p1.x)/6,cp2y=p2.y-(p3.y-p1.y)/6;
    path+=` C${cp1x.toFixed(1)} ${cp1y.toFixed(1)} ${cp2x.toFixed(1)} ${cp2y.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  const lastX=(data.length-1)*step,lastY=H-5-(data[data.length-1]-min)/range*(H-14);
  const gid='sg'+(++_sgId);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:${color};stop-opacity:.28"/>
      <stop offset="100%" style="stop-color:${color};stop-opacity:0"/>
    </linearGradient></defs>
    <path d="${path} L${W} ${H} L0 ${H} Z" fill="url(#${gid})"/>
    <path d="${path}" fill="none" style="stroke:${color};stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.5" style="fill:${color}"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="6" style="fill:${color};opacity:.2"/>
  </svg>`;
}

function drawPie(){
  const data=[{v:4,c:"#F53F3F",l:"机密"},{v:18,c:"#FF7D00",l:"秘密"},{v:6,c:"#165DFF",l:"内部"}];
  const tot=data.reduce((a,b)=>a+b.v,0);
  const cx=80,cy=70,R=46,r=26;
  let a0=-Math.PI/2,svg="";
  data.forEach(d=>{const a1=a0+d.v/tot*Math.PI*2;
    const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    const large=d.v/tot>0.5?1:0;
    svg+=`<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" style="fill:${d.c};stroke:var(--card);stroke-width:2"/>`;
    a0=a1;});
  $("#pieChart").innerHTML=`<svg viewBox="0 0 160 140" preserveAspectRatio="xMidYMid meet">
    ${svg}<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:var(--card)"/>

    <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--text)">${tot}</text></svg>`;
}
/* Y 轴刻度（给定数据范围 → 自动生成 5 段漂亮刻度） */
function niceTicks(minV,maxV,steps=5){
  const range=maxV-minV;if(range<=0)return{step:1,min:minV,max:minV+1,ticks:[minV,minV+1]};
  const raw=range/steps;const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;let step;
  if(norm<1.5)step=1;else if(norm<3)step=2;else if(norm<7)step=5;else step=10;
  step*=mag;
  const niceMin=Math.floor(minV/step)*step;
  const niceMax=Math.ceil(maxV/step)*step;
  const ticks=[];for(let v=niceMin;v<=niceMax+1e-9;v+=step)ticks.push(+v.toFixed(6));
  return{step,min:niceMin,max:niceMax,ticks};
}

/* 折线图（参考样式：左侧 Y 轴 + 底部 X 轴 + 虚线网格 + 平滑曲线 + 空心圆点 + 渐变面积） */
function drawLine(){
  const data=PASS_RATE.slice();
  const xs=["08-01","08-05","08-10","08-15","08-20","08-25"];
  const W=920,H=210,padL=48,padR=28,padT=18,padB=34;
  const innerW=W-padL-padR,innerH=H-padT-padB;
  const N=data.length,stepX=innerW/(N-1);
  const ticks=niceTicks(Math.min(...data),Math.max(...data),5);
  /* 折线坐标 */
  const pts=data.map((v,i)=>({x:padL+i*stepX,y:padT+innerH-(v-ticks.min)/(ticks.max-ticks.min)*innerH,val:v}));
  /* 平滑曲线 */
  let path=`M${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const cp1x=p1.x+(p2.x-p0.x)/6,cp1y=p1.y+(p2.y-p0.y)/6;
    const cp2x=p2.x-(p3.x-p1.x)/6,cp2y=p2.y-(p3.y-p1.y)/6;
    path+=` C${cp1x.toFixed(1)} ${cp1y.toFixed(1)} ${cp2x.toFixed(1)} ${cp2y.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  /* 网格 + Y 轴刻度 */
  let grid="",ylabels="";
  ticks.ticks.forEach(v=>{
    const y=padT+innerH-(v-ticks.min)/(ticks.max-ticks.min)*innerH;
    grid+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" style="stroke:var(--border);stroke-dasharray:2,3;stroke-width:1"/>`;
    ylabels+=`<text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="11" style="fill:var(--text-3)">${v}</text>`;
  });
  /* X 轴标签 */
  let xlabels="";
  pts.forEach((p,i)=>{xlabels+=`<text x="${p.x.toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="11" style="fill:var(--text-3)">${xs[i]||""}</text>`;});
  /* 数据点（空心圆 marker） */
  let dots="";
  pts.forEach(p=>{
    dots+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" style="fill:#fff;stroke:var(--cp);stroke-width:1.6"/>`;
  });
  /* 面积 */
  const area=path+` L${(W-padR).toFixed(1)} ${(padT+innerH).toFixed(1)} L${padL} ${(padT+innerH).toFixed(1)} Z`;
  $("#lineChart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="lg-cp-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--cp)" stop-opacity=".32"/>
      <stop offset="100%" stop-color="var(--cp)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}${ylabels}${xlabels}
    <path d="${area}" style="fill:url(#lg-cp-area)"/>
    <path d="${path}" fill="none" style="stroke:var(--cp);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/>
    ${dots}
  </svg>`;
}

function bankFile(el){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=e=>{$("#bk-imp").value=rd.result;toast("文件已读取");};rd.readAsText(f,"utf-8");}
function parseBankLines(text){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!s.startsWith("#"));
  const out=[];let maxId=Math.max(...bankData.map(b=>b.id));
  for(const ln of lines){
    const f=ln.split("|").map(x=>x.trim());
    if(f.length<5)continue;
    const type=f[0],cat=f[1]||"其他",lv=f[2]||"内部",diff=f[3]||"易",stem=f[4]||"";
    if(!stem)continue;
    let opts=[],ans=[];
    if(type==="填空题"||type==="简答题"){opts=[f[6]||""];ans=[];}
    else if(type==="判断题"){
      opts=(f[5]?f[5].split(/[;；]/).map(x=>x.trim()):["正确","错误"]).filter(Boolean);if(!opts.length)opts=["正确","错误"];
      const a=(f[6]||"A").trim();ans=[a==="B"||a==="错"||a==="错误"?1:0];
    } else {
      opts=f[5]?f[5].split(/[;；]/).map(x=>x.trim()).filter(Boolean):[];
      const al=(f[6]||"").split(/[;；,，]/).map(x=>x.trim().toUpperCase());
      al.forEach(L=>{const idx="ABCDEFG".indexOf(L);if(idx>=0&&idx<opts.length)ans.push(idx);});
    }
    out.push({id:++maxId,type,cat,lv,diff,stem,opts,ans,rate:"—",analysis:f[7]||""});
  }
  return out;
}
function saveBankImport(){
  const text=$("#bk-imp").value;
  const list=parseBankLines(text);
  if(!list.length){toast("未解析到有效试题，请检查格式");return;}
  if(!confirm(`确认导入 ${list.length} 道试题到题库？`))return;
  bankData.push(...list);closeModal();renderBank();toast(`已导入 ${list.length} 道试题`);
}

function doRandom(){
  const types=["单选题","多选题","判断题","填空题","简答题"];

    const w=$("#switchWarn");w.innerHTML=ic('alertTriangle')+`<span>检测到切屏/离开窗口 ${examState.switch} 次（上限 ${examState.maxSwitch} 次），涉密考试全程请勿离开</span>`;
    w.classList.add("show");setTimeout(()=>w.classList.remove("show"),3500);
    if(examState.switch>examState.maxSwitch){submitExam(true);}};
  window.addEventListener("blur",examState._blur);
}
function fmt(s){const m=String(Math.floor(s/60)).padStart(2,"0"),x=String(s%60).padStart(2,"0");return m+":"+x;}
function startTimer(){timer=setInterval(()=>{examState.timeLeft--;if(examState.timeLeft<=0){$("#tm").textContent="00:00";submitExam(true);return;}
  $("#tm").textContent=fmt(examState.timeLeft);if(examState.timeLeft%10===0){examState.auto=new Date().toLocaleTimeString();$("#autosave").textContent="已保存 "+examState.auto;}},1000);}
function paintQ(){const q=examState.questions[examState.idx];const multi=q.type==="多选题";
  let optHtml="";
  if(q.type==="简答题"){optHtml=`<textarea rows="6" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;background:var(--card-2);color:var(--text);font-family:inherit;resize:vertical" placeholder="请输入答案…">${examState.ans[q.id]||""}</textarea>`;}
  else if(q.type==="填空题"){optHtml=`<input value="${examState.ans[q.id]||""}" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;background:var(--card-2);color:var(--text)" placeholder="请输入答案">`;}
  else{q.opts.forEach((o,k)=>{const sel=(examState.ans[q.id]||[]).includes(k);
    optHtml+=`<div class="opt ${multi?'multi':''} ${sel?'sel':''}" onclick="chooseOpt(${k})"><span class="box">${sel?ic('check'):''}</span><span>${o}</span></div>`;});}
  $("#eq").innerHTML=`<div class="qt"><span class="no">第 ${examState.idx+1} 题</span><span>${q.type}</span><span style="color:var(--text-3);font-weight:400;font-size:13px">· ${q.cat}</span></div>
    <div class="qmeta">${lvTag(q.lv)} ${diffTag(q.diff)} <span style="margin-left:6px">${q.type==='简答题'?'开放题':q.type==='填空题'?'填空题':'选择题'}</span></div>
    <div style="font-size:15px;margin-bottom:14px;line-height:1.8">${q.stem}</div><div id="opts">${optHtml}</div>`;
  if(q.type==="简答题"||q.type==="填空题"){const el=$("#eq textarea,#eq input");el.oninput=()=>examState.ans[q.id]=el.value;}
  $("#flagBtn").innerHTML=ic('flag')+(examState.flag[q.id]?"<span>取消标记</span>":"<span>标记本题</span>");
  $$("#sg .sq").forEach(s=>s.classList.toggle("cur",+s.dataset.i===examState.idx));
}
function chooseOpt(k){const q=examState.questions[examState.idx];let cur=examState.ans[q.id]||[];
  if(q.type==="多选题"){cur=cur.includes(k)?cur.filter(x=>x!==k):[...cur,k];}
  else{cur=[k];}
  examState.ans[q.id]=cur;paintQ();buildSheet();}
function flagQ(){const q=examState.questions[examState.idx];examState.flag[q.id]=!examState.flag[q.id];buildSheet();paintQ();}
function buildSheet(){const g=$("#sg");if(!g)return;g.innerHTML=examState.questions.map((q,i)=>{
  const ans=examState.ans[q.id];const done=q.type==="简答题"||q.type==="填空题"?(ans&&ans.trim()):(ans&&ans.length);
  return `<div class="sq ${done?'ans':''} ${examState.flag[q.id]?'flag':''}" data-i="${i}" onclick="gotoQ(${i})">${i+1}</div>`;}).join("");
  const done=examState.questions.filter(q=>{const a=examState.ans[q.id];return q.type==="简答题"||q.type==="填空题"?(a&&a.trim()):(a&&a.length);}).length;
  $("#pg").textContent=`已答 ${done}/${examState.questions.length}`;}
function gotoQ(i){examState.idx=i;paintQ();}
function prevQ(){if(examState.idx>0){examState.idx--;paintQ();}}
function nextQ(){if(examState.idx<examState.questions.length-1){examState.idx++;paintQ();}}
function submitExam(forced){
  clearInterval(timer);window.removeEventListener("blur",examState._blur);
  let score=0;
  examState.questions.forEach(q=>{const a=examState.ans[q.id];
    if(q.type==="单选题"||q.type==="判断题"){if(a&&a[0]===q.ans[0])score+=10;}
    else if(q.type==="多选题"){if(a&&q.ans.length===a.length&&q.ans.every(x=>a.includes(x)))score+=10;}});
  const pass=score>=60;
  $("#v-take").innerHTML=`<div style="max-width:640px;margin:30px auto;text-align:center">
    <div style="font-size:54px;width:90px;height:90px;border-radius:50%;background:var(--cp-bg);color:var(--cp);display:flex;align-items:center;justify-content:center;margin:0 auto">${ic(forced?'clock':'award')}</div>

      <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border)"><span>客观题得分</span><b>${score} 分</b></div>
      <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border)"><span>含主观题</span><b style="color:var(--text-3)">需人工阅卷后计入</b></div>
      <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border)"><span>切屏记录</span><b>${examState.switch} 次</b></div>
      <div style="display:flex;justify-content:space-between;padding:9px 0"><span>结果</span><b style="color:${pass?'#00B42A':'#EF4444'}">${pass?'达到合格线':'未达合格线'}</b></div>

function scoreAnalysis(){
  const done=scores.filter(s=>s.score!=='阅卷中');
  if(!done.length){toast("暂无已出分成绩");return;}
  const tot=done.length,sum=done.reduce((a,s)=>a+(+s.score||0),0),avg=(sum/tot).toFixed(1);
  const max=Math.max(...done.map(s=>+s.score||0)),min=Math.min(...done.map(s=>+s.score||0));
  const passN=done.filter(s=>s.pass).length;
  const byExam={},byDept={};
  done.forEach(s=>{const g1=byExam[s.exam]||(byExam[s.exam]={n:0,sum:0,pass:0});g1.n++;g1.sum+=+s.score;if(s.pass)g1.pass++;
    const g2=byDept[s.dept]||(byDept[s.dept]={n:0,sum:0,pass:0});g2.n++;g2.sum+=+s.score;if(s.pass)g2.pass++;});
  const cards=[['参考人数',tot],['平均分',avg],['最高分',max],['最低分',min],['合格率',Math.round(passN/tot*100)+'%']];
  const examRows=Object.entries(byExam).map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td>${(v.sum/v.n).toFixed(1)}</td><td>${Math.round(v.pass/v.n*100)}%</td></tr>`).join("");
  const deptRows=Object.entries(byDept).map(([k,v])=>`<tr><td>${k}</td><td>${v.n}</td><td>${(v.sum/v.n).toFixed(1)}</td><td>${Math.round(v.pass/v.n*100)}%</td></tr>`).join("");
  openModal(`<div class="m-head"><h3>成绩分析</h3><button class="x" onclick="closeModal()">${ic('x')}</button></div>
  <div class="m-body">
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">
      ${cards.map(x=>`<div style="flex:1;min-width:90px;background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:12px"><div style="font-size:12px;color:var(--text-3)">${x[0]}</div><div style="font-size:22px;font-weight:700;color:var(--cp);margin-top:4px">${x[1]}</div></div>`).join("")}
    </div>
    <h4 style="margin:6px 0 8px;font-size:13px">按考试</h4>
    <table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="text-align:left;color:var(--text-3)"><th>考试</th><th>人数</th><th>平均分</th><th>合格率</th></tr></thead><tbody>${examRows}</tbody></table>
    <h4 style="margin:14px 0 8px;font-size:13px">按部门</h4>
    <table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="text-align:left;color:var(--text-3)"><th>部门</th><th>人数</th><th>平均分</th><th>合格率</th></tr></thead><tbody>${deptRows}</tbody></table>
  </div>
  <div class="m-foot"><button class="btn-2" onclick="closeModal()">关闭</button><button class="btn-p" onclick="exportAnalysis()">${ic('download')}<span>导出分析</span></button></div>`,"lg");
}
function exportAnalysis(){
  const done=scores.filter(s=>s.score!=='阅卷中');
  let csv="==按考试==\r\n考试,人数,平均分,合格率\r\n";
  const byExam={};done.forEach(s=>{const g=byExam[s.exam]||(byExam[s.exam]={n:0,sum:0,pass:0});g.n++;g.sum+=+s.score;if(s.pass)g.pass++;});

}

/* 柱状图（参考样式：左侧 Y 轴 + 底部 X 轴 + 圆角顶部柱 + 顶部深→底部浅渐变） */
function drawBar(sel,data,color){
  const W=920,H=210,padL=52,padR=28,padT=18,padB=34;
  const innerW=W-padL-padR,innerH=H-padT-padB;
  const vals=data.map(d=>d[1]);
  const ticks=niceTicks(0,Math.max(...vals),5);
  const N=data.length,slot=innerW/N,bw=Math.min(56,slot*0.46);
  const gradId="bg-"+Math.random().toString(36).slice(2,8);
  /* 网格 + Y 轴 */
  let grid="",ylabels="";
  ticks.ticks.forEach(v=>{
    const y=padT+innerH-(v-ticks.min)/(ticks.max-ticks.min)*innerH;
    grid+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" style="stroke:var(--border);stroke-dasharray:2,3;stroke-width:1"/>`;
    ylabels+=`<text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="11" style="fill:var(--text-3)">${v}</text>`;
  });
  let bars="",xlabels="",values="";
  data.forEach((d,i)=>{
    const cx2=padL+i*slot+slot/2;
    const h=(d[1]-ticks.min)/(ticks.max-ticks.min)*innerH;
    const by=padT+innerH-h;
    const bx=(cx2-bw/2).toFixed(1);
    /* 圆角顶部柱 */
    bars+=`<rect x="${bx}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="url(#${gradId})"/>`;
    /* 顶部数值 */
    values+=`<text x="${cx2.toFixed(1)}" y="${(by-5).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--text-2)">${d[1]}</text>`;
    /* X 轴标签 */
    xlabels+=`<text x="${cx2.toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="11" style="fill:var(--text-3)">${(d[0]||"").slice(0,6)}</text>`;
  });
  /* 底部坐标轴 */
  const axis=`<line x1="${padL}" y1="${(padT+innerH).toFixed(1)}" x2="${W-padR}" y2="${(padT+innerH).toFixed(1)}" style="stroke:var(--border)"/>`;
  $(sel).innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="1"/>
      <stop offset="100%" stop-color="${color}" stop-opacity=".32"/>
    </linearGradient></defs>
    ${grid}${ylabels}${xlabels}${axis}${bars}${values}
  </svg>`;
}
function drawDonut(){
  const d=[{v:2,c:"#F53F3F"},{v:2,c:"#FF7D00"},{v:1,c:"#165DFF"}];
  const tot=d.reduce((a,b)=>a+b.v,0);const cx=80,cy=70,R=42,r=24;let a0=-Math.PI/2,svg="";
  d.forEach(x=>{const a1=a0+x.v/tot*Math.PI*2;
    const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    svg+=`<path d="M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${x.v/tot>.5?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" style="fill:${x.c};stroke:var(--card);stroke-width:2"/>`;
    a0=a1;});
  $("#donutChart").innerHTML=`<svg viewBox="0 0 160 140" preserveAspectRatio="xMidYMid meet">${svg}<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:var(--card)"/><text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="12" style="fill:var(--text-3)">涉密</text><text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="16" font-weight="700" style="fill:var(--text)">${tot}</text></svg>`;
}
/* 成绩区间柱状图（参考样式：左侧 Y 轴 + 底部 X 轴 + 圆角柱 + 渐变 + 顶部数值） */
function drawHist(){
  const d=[["<60",2,"#EF4444"],["60-69",5,"#FF7D00"],["70-79",12,"#165DFF"],["80-89",28,"#00B42A"],["90+",11,"var(--cp)"]];
  const W=920,H=210,padL=48,padR=28,padT=18,padB=34;
  const innerW=W-padL-padR,innerH=H-padT-padB;
  const vals=d.map(x=>x[1]);
  const ticks=niceTicks(0,Math.max(...vals),5);
  const N=d.length,slot=innerW/N,bw=Math.min(76,slot*0.46);
  let grid="",ylabels="",bars="",xlabels="",values="";
  ticks.ticks.forEach(v=>{
    const y=padT+innerH-(v-ticks.min)/(ticks.max-ticks.min)*innerH;
    grid+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" style="stroke:var(--border);stroke-dasharray:2,3;stroke-width:1"/>`;
    ylabels+=`<text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="11" style="fill:var(--text-3)">${v}</text>`;
  });
  d.forEach((x,i)=>{
    const cx2=padL+i*slot+slot/2;
    const h=(x[1]-ticks.min)/(ticks.max-ticks.min)*innerH;
    const by=padT+innerH-h,bx=(cx2-bw/2).toFixed(1);
    const gid="hg-"+i;
    bars+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${x[2]}" stop-opacity="1"/>
      <stop offset="100%" stop-color="${x[2]}" stop-opacity=".32"/>
    </linearGradient></defs>`;
    bars+=`<rect x="${bx}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="url(#${gid})"/>`;
    values+=`<text x="${cx2.toFixed(1)}" y="${(by-5).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--text-2)">${x[1]}</text>`;
    xlabels+=`<text x="${cx2.toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="11" style="fill:var(--text-3)">${x[0]}</text>`;
  });
  const axis=`<line x1="${padL}" y1="${(padT+innerH).toFixed(1)}" x2="${W-padR}" y2="${(padT+innerH).toFixed(1)}" style="stroke:var(--border)"/>`;
  $("#hist").innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${grid}${ylabels}${bars}${xlabels}${values}${axis}</svg>`;
}

/* ============ 考生管理 ============ */
function renderPersons(){
  const lvC={核心:'t-red',重要:'t-amber',一般:'t-blue'};
  const rows=persons.map(p=>`<tr><td><div style="display:flex;align-items:center;gap:10px"><div style="width:32px;height:32px;border-radius:50%;background:var(--cp-bg);color:var(--cp);display:flex;align-items:center;justify-content:center;font-weight:600">${p.name[0]}</div><b>${p.name}</b></div></td>
    <td>${p.dept}</td><td><span class="tag ${lvC[p.lv]}">${p.lv}涉密</span></td>
    <td>${p.cert?'<span class="tag t-green"><i class="sdot g"></i>持证</span>':'<span class="tag t-red"><i class="sdot d"></i>未持证</span>'}</td><td>${p.last}</td>
    <td><div class="row-act"><span class="act-v">详情</span><span class="act-c" onclick="toast('已发送补考/复训提醒')">提醒</span><span class="act-d" onclick="delPerson(${p.id})">删除</span></div></td></tr>`).join("");
  $("#v-person").innerHTML=`
  <div class="page-head"><h2>考生管理</h2><span class="sub">涉密人员台账 · 持证状态跟踪</span><div class="spacer"></div>
    <button class="btn-2" onclick="openPersonImport()">${ic('upload')}<span>导入</span></button>
    <button class="btn-p" onclick="openPersonAdd()">${ic('plus')}<span>新增人员</span></button></div>
  <div class="card"><div class="tbl-wrap"><table><thead><tr><th>姓名</th><th>部门</th><th>涉密等级</th><th>持证</th><th>最近考试</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ============ 考生管理 · 新增 / 导入 ============ */
function openPersonAdd(){
  openModal(`<div class="m-head"><h3>新增涉密人员</h3><button class="x" onclick="closeModal()">${ic('x')}</button></div>
  <div class="m-body">
    <div class="f-row">
      <div class="field"><label>姓名</label><input id="pi-name" placeholder="请输入姓名" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card-2);color:var(--text)"></div>
      <div class="field"><label>部门</label><input id="pi-dept" placeholder="如：保密处" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card-2);color:var(--text)"></div>
    </div>
    <div class="f-row">
      <div class="field"><label>涉密等级</label><select id="pi-lv" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card-2);color:var(--text)"><option>一般</option><option>重要</option><option>核心</option></select></div>
      <div class="field"><label>持证状态</label><select id="pi-cert" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card-2);color:var(--text)"><option value="1">已持证</option><option value="0">未持证</option></select></div>
    </div>
    <div class="field"><label>最近考试</label><input id="pi-last" placeholder="可留空，默认：—" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card-2);color:var(--text)"></div>
  </div>
  <div class="m-foot"><button class="btn-2" onclick="closeModal()">取消</button><button class="btn-p" onclick="savePersonAdd()">${ic('check')}<span>保存</span></button></div>`,"lg");
}
function savePersonAdd(){
  const name=$("#pi-name").value.trim();
  if(!name){toast("请填写姓名");return;}
  const dept=$("#pi-dept").value.trim()||"未分配";
  const lv=$("#pi-lv").value;
  const cert=$("#pi-cert").value==="1";
  const last=$("#pi-last").value.trim()||"—";
  const nid=persons.reduce((m,p)=>Math.max(m,p.id),0)+1;
  persons.push({id:nid,name,dept,lv,cert,last});
  closeModal();renderPersons();toast("已新增人员："+name);
}
function openPersonImport(){
  openModal(`<div class="m-head"><h3>批量导入涉密人员</h3><button class="x" onclick="closeModal()">${ic('x')}</button></div>
  <div class="m-body">
    <p style="font-size:12.5px;color:var(--text-3);margin-bottom:10px;line-height:1.7">每行一条，用逗号或制表符分隔：<b>姓名,部门,涉密等级,持证</b>。涉密等级填 核心 / 重要 / 一般，持证填 是 / 否。也可下载模板填写后上传 CSV。</p>
    <div class="f-row" style="margin-bottom:10px">
      <button class="btn-2" onclick="downloadPersonTpl()">${ic('download')}<span>下载模板</span></button>
      <label class="btn-2" style="cursor:pointer">${ic('upload')}<span>上传 CSV</span><input type="file" id="pi-file" accept=".csv,.txt" style="display:none" onchange="personFile(this)"></label>
    </div>
    <div class="field"><label>数据粘贴区</label><textarea id="pi-text" rows="7" placeholder="李晓明,办公室,一般,是   王海,信息中心,重要,是" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card-2);color:var(--text);font-family:inherit;resize:vertical;line-height:1.7"></textarea></div>
  </div>
  <div class="m-foot"><button class="btn-2" onclick="closeModal()">取消</button><button class="btn-p" onclick="savePersonImport()">${ic('check')}<span>解析并导入</span></button></div>`,"lg");
}
function parsePersonLines(text){
  const out=[];
  text.split(/\r?\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    const c=line.split(/[,，\t]/).map(s=>s.trim());
    if(c.length<2||!c[0])return;
    const name=c[0],dept=c[1]||"未分配";
    const lv=["核心","重要","一般"].includes(c[2])?c[2]:"一般";
    const cert=/(是|有|true|持证|1)/i.test(c[3]||"");
    out.push({name,dept,lv,cert,last:"—"});
  });
  return out;
}
function savePersonImport(){
  const list=parsePersonLines($("#pi-text").value);
  if(!list.length){toast("未解析到有效数据");return;}
  let nid=persons.reduce((m,p)=>Math.max(m,p.id),0);
  list.forEach(o=>{nid++;persons.push({id:nid,...o});});
  closeModal();renderPersons();toast("已导入 "+list.length+" 名人员");
}
function personFile(input){
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{$("#pi-text").value=r.result;toast("已读取文件，请检查后导入");};
  r.readAsText(f);
}
function delPerson(id){
  const p=persons.find(x=>x.id===id);if(!p)return;
  if(!confirm(`确定要删除「${p.name}」(${p.dept})吗？该操作不可撤销。`))return;
  const i=persons.findIndex(x=>x.id===id);
  persons.splice(i,1);
  renderPersons();
  toast(`已删除「${p.name}」`);
}
function downloadPersonTpl(){
  const csv="姓名,部门,涉密等级,持证\r\n李晓明,办公室,一般,是\r\n王海,信息中心,重要,是\r\n张伟,保密处,核心,否";
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="涉密人员导入模板.csv";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ============ Toast ============ */
function toast(msg){const t=document.createElement("div");t.className="toast";
  t.innerHTML=ic('check')+`<span>${msg}</span>`;document.body.appendChild(t);
  setTimeout(()=>{t.style.transition=".25s";t.style.opacity="0";t.style.transform="translate(-50%,10px)";setTimeout(()=>t.remove(),250);},2000);}

/* 默认渲染 */
